<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e14" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="80%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Cyber Neon Gradient -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="glow-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0" />
      <stop offset="25%" stop-color="#2dd4bf" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="hud-panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0c0e14" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neon-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; }
    .pulse { animation: blink 2.5s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  </style>

  <!-- Outer Card Frame -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Background Tech Grid -->
  <g stroke="#1e293b" stroke-width="0.75" opacity="0.35">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="150" y1="0" x2="150" y2="320" />
    <line x1="300" y1="0" x2="300" y2="320" />
    <line x1="450" y1="0" x2="450" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="750" y1="0" x2="750" y2="320" />
    <line x1="900" y1="0" x2="900" y2="320" />
    <line x1="1050" y1="0" x2="1050" y2="320" />
  </g>

  <!-- Top HUD Status Bar -->
  <g class="mono" font-size="11" letter-spacing="1.5">
    <!-- Left badge -->
    <rect x="40" y="24" width="165" height="24" rx="12" fill="url(#hud-panel)" stroke="#334155" stroke-width="1" />
    <circle cx="56" cy="36" r="4" fill="#2dd4bf" class="pulse" />
    <text x="68" y="40" fill="#2dd4bf" font-weight="700">THEOWLOPS // CORE</text>

    <!-- Center Coordinates -->
    <text x="600" y="40" text-anchor="middle" fill="#94a3b8">AUTONOMOUS SYSTEMS ARCHITECTURE &amp; OPEN SOURCE</text>

    <!-- Right status -->
    <rect x="1005" y="24" width="155" height="24" rx="12" fill="url(#hud-panel)" stroke="#334155" stroke-width="1" />
    <circle cx="1022" cy="36" r="4" fill="#818cf8" />
    <text x="1034" y="40" fill="#818cf8" font-weight="700">FOUNDER &amp; ARCH</text>
  </g>

  <!-- Glowing Accent Divider -->
  <rect x="80" y="65" width="1040" height="1.5" fill="url(#glow-line)" filter="url(#neon-blur)" />

  <!-- Main Hero Title -->
  <text x="600" y="150" text-anchor="middle" class="sans" font-weight="900" font-size="64" letter-spacing="4" fill="url(#neon-cyan)" filter="url(#neon-blur)">
    RYAN PHAM
  </text>

  <!-- Subtitle / Mission Statement -->
  <text x="600" y="196" text-anchor="middle" class="mono" font-weight="600" font-size="18" letter-spacing="3" fill="#cbd5e1">
    AUTONOMOUS AI AGENTS • DISTRIBUTED SYSTEMS • RUST &amp; GO
  </text>

  <!-- Bottom Accent Divider -->
  <rect x="120" y="225" width="960" height="1.5" fill="url(#glow-line)" filter="url(#neon-blur)" />

  <!-- Hardware Status Badges -->
  <g class="mono" font-size="12" font-weight="600" transform="translate(0, 250)">
    <g transform="translate(140, 0)">
      <rect width="200" height="36" rx="18" fill="url(#hud-panel)" stroke="#2dd4bf" stroke-width="1" />
      <text x="100" y="23" text-anchor="middle" fill="#2dd4bf">⚡ RUST &amp; RATATUI TUI</text>
    </g>

    <g transform="translate(370, 0)">
      <rect width="220" height="36" rx="18" fill="url(#hud-panel)" stroke="#818cf8" stroke-width="1" />
      <text x="110" y="23" text-anchor="middle" fill="#818cf8">🧠 AGENT HARNESSES</text>
    </g>

    <g transform="translate(620, 0)">
      <rect width="210" height="36" rx="18" fill="url(#hud-panel)" stroke="#38bdf8" stroke-width="1" />
      <text x="105" y="23" text-anchor="middle" fill="#38bdf8">🛰️ DISTRIBUTED GATEWAYS</text>
    </g>

    <g transform="translate(860, 0)">
      <rect width="200" height="36" rx="18" fill="url(#hud-panel)" stroke="#a855f7" stroke-width="1" />
      <text x="100" y="23" text-anchor="middle" fill="#c084fc">🛡️ MULTI-CHANNEL SDKS</text>
    </g>
  </g>
</svg>
