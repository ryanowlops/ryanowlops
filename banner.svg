<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e14" />
      <stop offset="40%" stop-color="#111827" />
      <stop offset="80%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0" />
      <stop offset="30%" stop-color="#2dd4bf" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Cyber Grid Lines -->
  <g stroke="#1e293b" stroke-width="0.8" opacity="0.3">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="400" y1="0" x2="400" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="800" y1="0" x2="800" y2="320" />
    <line x1="1000" y1="0" x2="1000" y2="320" />
  </g>

  <!-- Glowing Accent Line -->
  <rect x="150" y="210" width="900" height="2" fill="url(#accent-line)" filter="url(#glow)" />

  <!-- Title / Identity -->
  <text x="600" y="130" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Fira Code', sans-serif" font-weight="900" font-size="58" letter-spacing="4" fill="url(#cyan-glow)" filter="url(#glow)">
    RYAN PHAM
  </text>

  <!-- Subtitle -->
  <text x="600" y="185" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Fira Code', monospace" font-weight="500" font-size="20" letter-spacing="3" fill="#94a3b8">
    AUTONOMOUS AI AGENTS  •  DISTRIBUTED SYSTEMS  •  RUST &amp; GO
  </text>

  <!-- Status pill -->
  <g transform="translate(485, 240)">
    <rect width="230" height="36" rx="18" fill="#0c0e14" stroke="#2dd4bf" stroke-width="1" opacity="0.9" />
    <circle cx="24" cy="18" r="5" fill="#2dd4bf">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="38" y="23" font-family="'Segoe UI', monospace" font-size="13" font-weight="600" fill="#2dd4bf" letter-spacing="1">ARCHITECT @ OWLOPS</text>
  </g>
</svg>
